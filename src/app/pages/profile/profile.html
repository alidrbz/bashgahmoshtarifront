<div dir="rtl" class="min-h-screen bg-gray-50 p-6">

  <!-- HEADER -->

  <div class="mb-8">

    <h1 class="text-3xl font-black text-gray-900">
      پروفایل من 👤
    </h1>

    <p class="mt-2 text-sm text-gray-500">
      اطلاعات حساب کاربری خود را مدیریت کنید
    </p>

  </div>


  <div class="grid gap-6 lg:grid-cols-3">

    <!-- USER CARD -->

    <div class="rounded-3xl border border-gray-200 bg-white p-6">

      <div class="flex flex-col items-center text-center">

        <div
          class="flex h-28 w-28 items-center justify-center rounded-full bg-red-100 text-5xl"
        >
          👤
        </div>

        <h2 class="mt-5 text-xl font-black text-gray-900">
          {{ user.firstName }} {{ user.lastName }}
        </h2>

        <p class="mt-1 text-sm text-gray-400">
          @{{ user.username }}
        </p>

        <div
          class="mt-4 rounded-full bg-yellow-50 px-4 py-2 text-sm font-bold text-yellow-600"
        >
          ⭐ مشتری طلایی
        </div>

      </div>


      <!-- STATS -->

      <div class="mt-8 grid grid-cols-2 gap-3">

        <div class="rounded-2xl bg-gray-50 p-4 text-center">

          <p class="text-2xl font-black text-red-600">
            ۱۲۵۰
          </p>

          <p class="mt-1 text-xs text-gray-400">
            امتیاز
          </p>

        </div>


        <div class="rounded-2xl bg-gray-50 p-4 text-center">

          <p class="text-2xl font-black text-gray-900">
            ۲۴
          </p>

          <p class="mt-1 text-xs text-gray-400">
            خرید
          </p>

        </div>

      </div>

    </div>


    <!-- FORM -->

    <div class="rounded-3xl border border-gray-200 bg-white p-6 lg:col-span-2">

      <div class="mb-6">

        <h2 class="text-xl font-black text-gray-900">
          اطلاعات شخصی
        </h2>

        <p class="mt-1 text-sm text-gray-400">
          اطلاعات خود را ویرایش و ذخیره کنید
        </p>

      </div>


      <form
        (ngSubmit)="saveProfile()"
        class="grid gap-5 md:grid-cols-2"
      >

        <!-- FIRST NAME -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            نام
          </label>

          <input
            type="text"
            name="firstName"
            [(ngModel)]="user.firstName"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
          />

        </div>


        <!-- LAST NAME -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            نام خانوادگی
          </label>

          <input
            type="text"
            name="lastName"
            [(ngModel)]="user.lastName"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
          />

        </div>


        <!-- USERNAME -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            نام کاربری
          </label>

          <input
            type="text"
            name="username"
            [(ngModel)]="user.username"
            class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 outline-none"
          />

        </div>


        <!-- PHONE -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            شماره موبایل
          </label>

          <input
            type="text"
            name="phone"
            [(ngModel)]="user.phone"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
          />

        </div>


        <!-- EMAIL -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            ایمیل
          </label>

          <input
            type="email"
            name="email"
            [(ngModel)]="user.email"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
          />

        </div>


        <!-- CITY -->

        <div>

          <label class="mb-2 block text-sm font-bold text-gray-700">
            شهر
          </label>

          <select
            name="city"
            [(ngModel)]="user.city"
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
          >

            <option value="تهران">
              تهران
            </option>

            <option value="کرج">
              کرج
            </option>

            <option value="اصفهان">
              اصفهان
            </option>

            <option value="شیراز">
              شیراز
            </option>

            <option value="مشهد">
              مشهد
            </option>

          </select>

        </div>


        <!-- BUTTON -->

        <div class="md:col-span-2">

          <button
            type="submit"
            class="rounded-xl bg-red-600 px-6 py-3 text-sm font-bold text-white transition hover:bg-red-700"
          >
            ذخیره تغییرات
          </button>

        </div>

      </form>


      <!-- SUCCESS -->

      @if (saved) {

        <div
          class="mt-5 rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm font-bold text-green-700"
        >
          ✅ اطلاعات پروفایل با موفقیت ذخیره شد.
        </div>

      }

    </div>

  </div>

</div>
